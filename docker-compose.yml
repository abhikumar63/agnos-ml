version: '3.8'

services:
  # ----------------------------------------
  # 1. Custom Application Services
  # ----------------------------------------
  agnos-engine:
    build:
      context: .
      dockerfile: ./engine/Dockerfile.engine
    container_name: agnos_engine_cpp
    environment:
      # We now point to the user-space /app/data mount
      - MODEL_PATH=/app/data/models/v1_base_mlp.agnos 
    ports:
      - "50051:50051"
    volumes:
      # Mount the local folder safely into the /app workspace
      - ./data/models:/app/data/models 
    networks:
      - agnos-net

  agnos-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: agnos_api_go
    environment:
      - ENGINE_ADDRESS=agnos-engine:50051
    ports:
      - "8080:8080"
    depends_on:
      - agnos-engine
      # - kafka
      # - redis
      # - postgres
    networks:
      - agnos-net

